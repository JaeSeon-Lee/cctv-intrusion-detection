[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cctv-intrusion"
version = "0.1.0"
description = "CCTV 영상에서 위험구역 침입을 탐지하고 침입 구간을 저장하는 앱"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11",
    "opencv-python>=5.0",
    "numpy>=2.0",
    "torch>=2.0",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-qt"]

[project.scripts]
cctv-intrusion = "cctv_intrusion.app:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 줄 길이는 formatter가 맞춘다. (E501은 한글을 폭 2로 계산해서 주석 줄이 과하게 걸림)
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
